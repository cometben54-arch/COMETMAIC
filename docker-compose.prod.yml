# =============================================================================
# Production Docker Compose — OpenMAIC + Cloudflare Tunnel
#
# Prerequisites:
#   1. Copy .env.example to .env.local and fill in your API keys
#   2. Get a Cloudflare Tunnel token:
#      - Go to https://one.dash.cloudflare.com → Networks → Tunnels
#      - Create a tunnel, copy the token
#      - Set the tunnel's public hostname to point to http://openmaic:3000
#   3. Set the token in .env.local:  CLOUDFLARE_TUNNEL_TOKEN=eyJ...
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f openmaic
#   docker compose -f docker-compose.prod.yml down
# =============================================================================

services:
  openmaic:
    build: .
    container_name: openmaic
    env_file:
      - .env.local
    volumes:
      # Persistent storage for classroom data, generated media, and job state
      - openmaic-data:/app/data
      # Optional: mount server-providers.yml for provider config (alternative to env vars)
      # - ./server-providers.yml:/app/server-providers.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Do NOT expose ports externally — Cloudflare Tunnel handles ingress
    # If you need local access for debugging, uncomment:
    # ports:
    #   - "127.0.0.1:3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      openmaic:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openmaic-data:
